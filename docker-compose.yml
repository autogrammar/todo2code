services:
  t2c-a2a:
    build:
      context: .
      dockerfile: Dockerfile
    image: todo2code:local
    env_file:
      - .env
    environment:
      T2C_ROOT: /workspace
      T2C_A2A_HOST: 0.0.0.0
      T2C_A2A_PORT: 8787
      T2C_A2A_PUBLIC_URL: ${T2C_A2A_PUBLIC_URL:-http://localhost:8787/a2a}
    ports:
      - "${T2C_A2A_PORT:-8787}:8787"
    volumes:
      - "${T2C_WORKSPACE:-.}:/workspace"
    restart: unless-stopped
