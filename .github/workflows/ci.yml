name: ci

on:
  push:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]
  workflow_dispatch:
  schedule:
    # Live provider checks only. The offline verify jobs never gate on this
    # trigger, so CI can never start depending on provider uptime.
    - cron: '17 4 * * 1'

permissions:
  contents: read
  pull-requests: read

jobs:
  governance:
    name: governance / enforce
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Resolve independent current-head approval
        id: approval
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {pathToFileURL} = require('url');
            const resolver = await import(pathToFileURL(path.resolve('.governance/resolve-approval.mjs')).href);
            const manifest = JSON.parse(fs.readFileSync('.governance/manifest.json', 'utf8'));
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });
            const author = context.payload.pull_request.user.login;
            const active = fs.readdirSync('project', {withFileTypes: true})
              .filter(item => item.isDirectory() && /^ticket-[0-9]{3}$/.test(item.name))
              .filter(item => {
                const readme = fs.readFileSync(path.join('project', item.name, 'README.md'), 'utf8');
                return /^-\s+\*\*Status\*\*:\s*(PLAN|IN_PROGRESS|BLOCKED)\s*$/mi.test(readme);
              }).map(item => item.name);
            const resolution = resolver.resolveTrustedApproval({
              reviews,
              authorLogin: author,
              headSha: context.payload.pull_request.head.sha,
              activeTickets: active,
              manifest,
            });
            core.setOutput('source', resolution.source);
            core.setOutput('actor', resolution.actor || 'none');
            core.setOutput('actor-type', resolution.actorType || 'none');
            core.setOutput('ticket', resolution.approvedTickets.length > 0 ? resolution.approvedTickets.join(',') : 'none');
            core.setOutput('correlation-id', resolution.correlationId || 'none');
      - name: Validate ticket, intent, scope, ownership and pinned files
        shell: bash
        env:
          APPROVAL_SOURCE: ${{ steps.approval.outputs.source }}
          APPROVED_TICKET: ${{ steps.approval.outputs.ticket }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=(--actor ci --format text)
          if [[ "${{ github.event_name }}" == pull_request || "${{ github.event_name }}" == pull_request_review ]]; then
            args+=(--base "$BASE_SHA" --enforce-approval --approval-source "$APPROVAL_SOURCE" --approved-ticket "$APPROVED_TICKET")
          fi
          bash project/governance-check.sh "${args[@]}"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --omit=optional
      - run: make verify
      - run: make smoke
      - run: make docker-smoke

  java-adapter:
    name: Java adapter (JDK 17 required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --omit=optional
      - run: npm run build
      - name: Run required Java fixture
        env:
          T2C_REQUIRE_JAVA_TEST: '1'
        run: node --test --test-name-pattern='^Java adapter records' dist/test/ast-languages.test.js

  live-openrouter:
    name: Live OpenRouter contract (opt-in)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      T2C_REQUIRE_LIVE_CHECK: '1'
      T2C_LIVE_MAX_STAGE_LATENCY_MS: '300000'
      T2C_LIVE_MAX_TOTAL_LATENCY_MS: '900000'
      T2C_LIVE_MAX_COST_USD: '0.5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional
      # A trend is only readable if it survives the run that produced it. The
      # unique key always writes a fresh entry; the prefix restores the newest
      # previous one, so each scheduled run appends rather than starts over.
      - name: Restore recorded live-check history
        uses: actions/cache@v4
        with:
          path: .intent-live/contract-check-history.json
          key: live-contract-history-${{ github.run_id }}
          restore-keys: live-contract-history-
      - name: Check six-stage structured contracts and budgets
        if: env.OPENROUTER_API_KEY != ''
        run: npm run live:check
      - name: Explain disabled live check
        if: env.OPENROUTER_API_KEY == ''
        run: echo 'OPENROUTER_API_KEY secret is not configured; live check is opt-in.'
      - uses: actions/upload-artifact@v4
        if: always() && env.OPENROUTER_API_KEY != ''
        with:
          name: openrouter-contract-audit
          path: |
            .intent-live/contract-check.json
            .intent-live/contract-check-history.json
