name: koru-code-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Exact base commit to compare
        required: true
        type: string
      head_sha:
        description: Exact head commit to review
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: koru-code-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    name: koru / code-review
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KORU_VERSION: '0.1.444'
      VALLM_VERSION: '0.1.94'
      REVIEW_MODEL: openrouter/google/gemini-3.1-pro-preview
      VALLM_REVIEW_MAX_TOKENS: '8192'
      VALLM_REVIEW_TIMEOUT_SECONDS: '420'
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BASE_SHA: ${{ inputs.base_sha || github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ inputs.head_sha || github.event.pull_request.head.sha }}
    steps:
      - name: Check out the exact reviewed commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ env.HEAD_SHA }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install pinned review tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "koru==${KORU_VERSION}" \
            "vallm[llm,security]==${VALLM_VERSION}"
          test "$(koru --version)" = "koru ${KORU_VERSION}"
          python - <<'PY'
          from importlib.metadata import version
          import sys

          expected = {"koru": "0.1.444", "vallm": "0.1.94"}
          actual = {name: version(name) for name in expected}
          if actual != expected:
              raise SystemExit(f"review tool version mismatch: {actual}")
          sys.stdout.write(f"review tools pinned: {actual}\n")
          PY

      - name: Resolve the exact changed source set
        id: files
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${HEAD_SHA}^{commit}")"
          mkdir -p .koru-review/vallm
          git diff --diff-filter=ACMR --name-only -z "${BASE_SHA}" "${HEAD_SHA}" -- \
            '*.c' '*.cc' '*.cpp' '*.cxx' '*.go' '*.java' '*.js' '*.jsx' \
            '*.php' '*.py' '*.rs' '*.ts' '*.tsx' \
            | while IFS= read -r -d '' path; do
                case "$path" in
                  dist/*|node_modules/*|project/*|.intent*/*|test/fixtures/*|tests/fixtures/*) ;;
                  *) printf '%s\n' "$path" ;;
                esac
              done > .koru-review/files.txt
          sort -u -o .koru-review/files.txt .koru-review/files.txt
          count="$(wc -l < .koru-review/files.txt | tr -d ' ')"
          printf 'count=%s\n' "$count" >> "$GITHUB_OUTPUT"
          printf 'Reviewed base: `%s`\nReviewed head: `%s`\nSelected source files: `%s`\n' \
            "$BASE_SHA" "$HEAD_SHA" "$count" >> "$GITHUB_STEP_SUMMARY"

      - name: Require semantic-review credentials
        if: steps.files.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$OPENROUTER_API_KEY" ]]; then
            echo 'KORU-REVIEW-001: semantic review credential is unavailable; trusted rerun required.' >&2
            exit 1
          fi

      - name: Prepare the read-only Koru command
        shell: bash
        run: |
          set -euo pipefail
          compat_dir="$RUNNER_TEMP/vallm-compat"
          mkdir -p "$compat_dir"
          cat > "$compat_dir/sitecustomize.py" <<'PY'
          """Pinned compatibility boundary for Vallm 0.1.94."""

          from __future__ import annotations

          import os

          import litellm
          import tree_sitter_language_pack


          _original_completion = litellm.completion
          _original_get_parser = tree_sitter_language_pack.get_parser


          def _bounded_completion(*args, **kwargs):
              kwargs["max_tokens"] = int(os.environ["VALLM_REVIEW_MAX_TOKENS"])
              kwargs["timeout"] = float(os.environ["VALLM_REVIEW_TIMEOUT_SECONDS"])
              # Provider HTTP errors, including 404, must fail immediately.
              kwargs["num_retries"] = 0
              return _original_completion(*args, **kwargs)


          def _normalized_get_parser(language):
              if isinstance(language, str):
                  language = language.lower()
              return _original_get_parser(language)


          litellm.completion = _bounded_completion
          tree_sitter_language_pack.get_parser = _normalized_get_parser
          PY
          command_path="$RUNNER_TEMP/koru-review-command"
          cat > "$command_path" <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          mapfile -t files < .koru-review/files.txt
          if (( ${#files[@]} == 0 )); then
            printf '%s\n' '{"summary":{"total_files":0,"passed":0,"failed":0,"success_rate":1.0},"files":[],"failed_files":[]}' \
              > .koru-review/vallm/validation.json
            exit 0
          fi
          export VALLM_LLM_PROVIDER=litellm
          export VALLM_LLM_MODEL="$REVIEW_MODEL"
          export VALLM_LLM_BASE_URL=https://openrouter.ai/api/v1
          export PYTHONPATH="${VALLM_COMPAT_DIR}${PYTHONPATH:+:${PYTHONPATH}}"
          set +e
          timeout --signal=TERM "${VALLM_REVIEW_TIMEOUT_SECONDS}s" \
            vallm batch "${files[@]}" \
            --semantic --security \
            --model "$REVIEW_MODEL" \
            --format json --output .koru-review/vallm --show-issues
          vallm_exit="$?"
          set -e
          if [[ "$vallm_exit" == '124' || "$vallm_exit" == '137' ]]; then
            printf '{"summary":{"total_files":%s,"passed":0,"failed":%s,"success_rate":0.0},"files":[],"failed_files":[{"error":"review timed out after %s seconds"}]}\n' \
              "${#files[@]}" "${#files[@]}" "$VALLM_REVIEW_TIMEOUT_SECONDS" \
              > .koru-review/vallm/validation.json
            exit "$vallm_exit"
          fi
          if [[ ! -f .koru-review/vallm/validation.json ]]; then
            echo "KORU-REVIEW-003: Vallm exited ${vallm_exit} without a report." >&2
            exit 1
          fi
          python - "$vallm_exit" <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path
          import sys


          report_path = Path(".koru-review/vallm/validation.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          expected_paths = {
              line.strip()
              for line in Path(".koru-review/files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          }
          files = report.get("files") if isinstance(report.get("files"), list) else []
          reviewed_paths = {
              item.get("path") for item in files if isinstance(item, dict) and item.get("path")
          }
          failed_files = []
          passed = 0
          for item in files:
              if not isinstance(item, dict):
                  failed_files.append({"error": "malformed Vallm file result"})
                  continue
              issues = item.get("issues") if isinstance(item.get("issues"), list) else []
              blocking = []
              advisory = []
              for issue in issues:
                  if not isinstance(issue, dict):
                      blocking.append({"rule": "report.malformed", "severity": "error"})
                      continue
                  rule = str(issue.get("rule", ""))
                  severity = str(issue.get("severity", "")).lower()
                  if rule == "semantic.llm_judge" and severity in {"info", "warning"}:
                      advisory.append(issue)
                  else:
                      blocking.append(issue)
              item["blocking_issues_count"] = len(blocking)
              item["advisory_issues_count"] = len(advisory)
              if item.get("verdict") == "pass" and not blocking:
                  passed += 1
              else:
                  failed_files.append({
                      "path": item.get("path"),
                      "error": f"blocking verdict/findings: {len(blocking)}",
                  })
          missing_paths = sorted(expected_paths - reviewed_paths)
          failed_files.extend({"path": path, "error": "missing Vallm result"} for path in missing_paths)
          unexpected_paths = sorted(reviewed_paths - expected_paths)
          failed_files.extend({"path": path, "error": "unexpected Vallm result"} for path in unexpected_paths)
          total = len(expected_paths)
          failed = total - passed
          report["summary"] = {
              "total_files": total,
              "passed": passed,
              "failed": failed,
              "success_rate": passed / total if total else 1.0,
          }
          report["failed_files"] = failed_files
          report["policy"] = {
              "semanticInfoAndWarnings": "advisory when file verdict is pass",
              "allOtherFindings": "blocking",
              "providerErrors": "blocking without retry",
              "originalVallmExitCode": int(sys.argv[1]),
          }
          report_path.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          raise SystemExit(0 if failed == 0 and not failed_files else 1)
          PY
          BASH
          chmod 0700 "$command_path"
          printf 'VALLM_COMPAT_DIR=%s\n' "$compat_dir" >> "$GITHUB_ENV"
          printf 'KORU_REVIEW_COMMAND=%s\n' "$command_path" >> "$GITHUB_ENV"

      - name: Run one bounded Koru review round
        id: koru
        shell: bash
        run: |
          set -uo pipefail
          set +e
          koru \
            --workspace "$(dirname "$GITHUB_WORKSPACE")" \
            --include "$(basename "$GITHUB_WORKSPACE")" \
            --max-rounds 1 \
            --command "$KORU_REVIEW_COMMAND" \
            2>&1 | tee .koru-review/koru.log
          review_exit="${PIPESTATUS[0]}"
          set -e
          printf 'exit_code=%s\n' "$review_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build commit-bound review report
        if: always()
        shell: bash
        env:
          KORU_EXIT_CODE: ${{ steps.koru.outputs.exit_code || '1' }}
        run: |
          set -euo pipefail
          mkdir -p .koru-review/vallm
          test -f .koru-review/files.txt || : > .koru-review/files.txt
          if [[ ! -f .koru-review/vallm/validation.json ]]; then
            printf '%s\n' '{"summary":{"total_files":0,"passed":0,"failed":1,"success_rate":0.0},"files":[],"failed_files":[{"error":"review did not produce a report"}]}' \
              > .koru-review/vallm/validation.json
          fi
          jq -n \
            --arg schema 't2c.koru-code-review/v1' \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg baseSha "$BASE_SHA" \
            --arg headSha "$HEAD_SHA" \
            --arg koruVersion "$KORU_VERSION" \
            --arg vallmVersion "$VALLM_VERSION" \
            --arg model "$REVIEW_MODEL" \
            --argjson exitCode "$KORU_EXIT_CODE" \
            --rawfile selectedFiles .koru-review/files.txt \
            --slurpfile validation .koru-review/vallm/validation.json \
            '{
              schema: $schema,
              repository: $repository,
              baseSha: $baseSha,
              headSha: $headSha,
              tools: {koru: $koruVersion, vallm: $vallmVersion, model: $model},
              selectedFiles: ($selectedFiles | split("\n") | map(select(length > 0))),
              verdict: (if $exitCode == 0 then "pass" else "reject" end),
              exitCode: $exitCode,
              validation: $validation[0]
            }' > .koru-review/review.json
          jq '{schema, repository, baseSha, headSha, tools, selectedFiles, verdict, exitCode}' \
            .koru-review/review.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Koru review evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: koru-code-review-${{ github.run_id }}
          path: .koru-review/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Attest the commit-bound review report
        if: always() && hashFiles('.koru-review/review.json') != ''
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: .koru-review/review.json

      - name: Enforce the Koru verdict
        if: always()
        shell: bash
        env:
          KORU_EXIT_CODE: ${{ steps.koru.outputs.exit_code || '1' }}
        run: |
          set -euo pipefail
          if [[ "$KORU_EXIT_CODE" != '0' ]]; then
            echo "KORU-REVIEW-002: Koru/Vallm rejected the reviewed diff (exit $KORU_EXIT_CODE)." >&2
            exit 1
          fi
