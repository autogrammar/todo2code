[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "todo2code"
version = "0.5.1"
description = "Dependency-free Python SDK for todo2code A2A and the local TypeScript runtime"
readme = "sdk/python/README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = []

[tool.setuptools]
package-dir = {"" = "sdk/python"}
packages = ["todo2code"]
py-modules = ["todo2code_sdk"]

[tool.wellmanifest]
standard = "0.20.22"
revision = "dc2240c22d49391845fef07f32664f37b904504f"
gate = "project/governance-check.sh"

[tool.pytest.ini_options]
addopts = "-p wellmanifest_governance"
