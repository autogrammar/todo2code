[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "todo2code-sdk"
version = "0.5.0"
description = "Dependency-free Python SDK for todo2code A2A and the local TypeScript runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]

[tool.setuptools]
# `todo2code` holds the implementation; `todo2code_sdk` is the diff-focused facade.
packages = ["todo2code"]
py-modules = ["todo2code_sdk"]
